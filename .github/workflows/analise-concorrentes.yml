name: Análise de Concorrentes Twygo

on:
  schedule:
    - cron: '0 12 * * 1'  # toda segunda às 9h BRT (12h UTC)
  workflow_dispatch:       # permite rodar manualmente

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar análise
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analise-concorrentes.js

      - name: Salvar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add relatorios/
          git diff --staged --quiet || git commit -m "Relatório semanal $(date +'%Y-%m-%d')"
          git push
